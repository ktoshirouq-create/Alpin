<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Training guide</title>
<meta name="theme-color" content="#0B151D">
<meta name="description" content="Illustrated training, stretching and warm-up routines with timers.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png" type="image/png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8EEF1;--panel:#F7FAFB;--ink:#1C2A36;--far:#97A7B4;--prop:#C5D1D9;
  --acc:#B8352A;--muted:#566674;--rule:#CAD5DC;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10181F;--panel:#18232C;--ink:#E3EAEF;--far:#5F717F;--prop:#2C3A46;
    --acc:#EE7263;--muted:#9AAAB6;--rule:#26333D;
  }
}
:root[data-theme="dark"]{
  --bg:#10181F;--panel:#18232C;--ink:#E3EAEF;--far:#5F717F;--prop:#2C3A46;
  --acc:#EE7263;--muted:#9AAAB6;--rule:#26333D;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);
  font:400 16px/1.5 Barlow,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 18px 48px}
.flags{display:block;width:100%;height:auto}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
  display:flex;gap:8px;padding:10px 0;border-bottom:1px solid var(--rule);overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;font-weight:600;font-size:15px;line-height:1;background:none;
  padding:9px 14px;border:1.5px solid var(--ink);border-radius:999px}
nav button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
header{padding:22px 0 4px}
h1{font:700 clamp(44px,12vw,72px)/.92 "Barlow Condensed","Arial Narrow",sans-serif;margin:0 0 12px;letter-spacing:-.01em}
.lede{margin:0;color:var(--muted);max-width:52ch}
section{padding-top:30px}
.sechead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px}
h2{font:700 34px/1 "Barlow Condensed",sans-serif;margin:0}
.sub{color:var(--muted);margin:4px 0 6px}
.go{background:var(--acc);color:#fff;border:0;border-radius:999px;padding:10px 16px;font-weight:600;display:inline-flex;gap:8px;align-items:center}
.go svg{width:12px;height:12px;fill:currentColor}
.gos{display:flex;gap:8px}
.go.alt{background:none;color:var(--acc);border:1.5px solid var(--acc)}
.grp{display:flex;align-items:baseline;gap:10px;margin-top:22px;padding-bottom:6px;border-bottom:2px solid var(--ink)}
.grp h4{font:700 22px/1 "Barlow Condensed",sans-serif;margin:0}
.grp span{color:var(--muted);font-size:14px}
.grp+.ex{border-top:0}
.ex{border-top:1px solid var(--rule);padding:20px 0 8px}
.exhead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:2px 12px;margin-bottom:10px}
h3{font:600 25px/1.1 "Barlow Condensed",sans-serif;margin:0}
.dose{font-weight:600;color:var(--acc)}
.frames{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:8px;margin:0;padding:0;list-style:none}
.frames[style*="--n:1"]{max-width:240px}
.frames li{background:var(--panel);border-radius:12px;padding:6px 6px 10px}
.frames svg{display:block;width:100%;height:auto}
.cap{display:flex;gap:6px;font-size:14px;line-height:1.3;padding:0 4px}
.num{flex:0 0 auto;width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--bg);
  font:600 12px/20px Barlow,sans-serif;text-align:center}
.cue{margin:10px 0 0;padding-left:12px;border-left:3px solid var(--acc);font-size:15px;white-space:pre-line}
.acts{display:flex;gap:16px;align-items:center;margin-top:10px}
.go.sm{padding:8px 14px;font-size:15px}
.link{background:none;border:0;padding:6px 0;color:var(--muted);font-size:14px;text-decoration:underline;text-underline-offset:3px}
.add{width:100%;margin-top:14px;padding:14px;border:1.5px dashed var(--muted);border-radius:12px;background:none;font-weight:600;color:var(--muted)}
.tag{font-size:12px;font-weight:600;color:var(--muted);border:1px solid var(--rule);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:middle}
footer{margin-top:28px;color:var(--muted);font-size:14px}
.ink{fill:none;stroke:var(--ink);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.far{fill:none;stroke:var(--far);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.head{fill:var(--ink)}
.prop{fill:var(--prop)}
.floor{stroke:var(--prop);stroke-width:2}
.acc{stroke:var(--acc);stroke-width:3;stroke-linecap:round;fill:none}
.accf{fill:var(--acc)}
.band{stroke:var(--acc);stroke-width:4;stroke-linecap:round}
.dbl{fill:var(--ink)}
.pack{fill:var(--far)}
dialog{border:0;border-radius:16px;padding:0;background:var(--bg);color:var(--ink);width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px)}
dialog::backdrop{background:rgba(10,16,22,.55)}
dialog form{padding:20px;display:flex;flex-direction:column;gap:12px}
dialog h2{font-size:30px}
dialog label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:14px}
dialog input:not([type=checkbox]),dialog textarea,dialog select{font-weight:400;font-size:16px;padding:10px 12px;border:1.5px solid var(--rule);border-radius:10px;background:var(--panel);width:100%}
dialog .row{display:flex;gap:12px;align-items:flex-end}
dialog .row label:first-child{flex:1}
dialog label.chk{flex-direction:row;align-items:center;gap:8px;padding-bottom:12px;white-space:nowrap}
dialog .chk input{width:20px;height:20px}
.hint{font-weight:400;color:var(--muted);font-size:13px}
.dbtns{display:flex;gap:8px;align-items:center;margin-top:4px}
.dbtns span{flex:1}
.btn{border:1.5px solid var(--ink);background:none;border-radius:999px;padding:9px 16px;font-weight:600}
.btn.pri{background:var(--ink);color:var(--bg)}
.btn.danger{border-color:var(--acc);color:var(--acc)}
/* follow-along */
#fa{position:fixed;inset:0;z-index:20;background:var(--bg);display:none;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 18px calc(env(safe-area-inset-bottom,0px) + 14px)}
#fa.open{display:flex}
.fatop{display:flex;align-items:center;justify-content:space-between;max-width:760px;width:100%;margin:0 auto}
.fatop .x{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--ink);background:none;font-size:20px}
.fastep{color:var(--muted);font-weight:600}
.faprog{display:flex;gap:3px;max-width:760px;width:100%;margin:10px auto 0}
.faprog i{flex:1;height:4px;border-radius:2px;background:var(--prop)}
.faprog i.on{background:var(--acc)}
.fabody{flex:1;overflow:auto;max-width:760px;width:100%;margin:0 auto;padding-top:14px}
.faname{font:600 32px/1.05 "Barlow Condensed",sans-serif;margin:0}
.fadose{margin:2px 0 12px;font-size:17px}
#faSkip{color:var(--acc)}
.fabody h3{font-size:34px}
.fatimer{text-align:center;padding:10px 0 4px}
.fanum{font:700 88px/1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums}
.falbl{color:var(--muted);font-weight:600;min-height:1.5em}
.fabtns{display:flex;gap:10px;max-width:760px;width:100%;margin:0 auto;padding-top:10px}
.fabtns .btn{flex:1;padding:14px;font-size:17px}
.fabtns .btn.pri{flex:1.6;background:var(--acc);border-color:var(--acc);color:#fff}
@media (prefers-reduced-motion:no-preference){.fanum.pulse{animation:p .5s}@keyframes p{50%{transform:scale(1.08)}}}

/* levels */
.lv{margin-top:14px;background:var(--panel);border-radius:14px;padding:10px 12px 12px}
.lvtxt{font-size:15px;line-height:1.3;margin-bottom:10px}
.lvn{display:inline-block;font:700 13px/1 Barlow,sans-serif;letter-spacing:.02em;color:var(--acc);margin-right:8px}
.dots{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;position:relative}
.dots::before{content:"";position:absolute;left:10%;right:10%;top:50%;height:2px;background:var(--rule);z-index:0}
.dot{position:relative;z-index:1;display:flex;justify-content:center}
.dot span{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:16px;
  background:var(--panel);border:2px solid var(--rule);color:var(--muted);transition:background .15s,border-color .15s}
.dot.past span{border-color:var(--acc);color:var(--acc)}
.dot input{position:absolute;inset:-4px;width:auto;height:auto;margin:0;opacity:0;cursor:pointer;z-index:2}
.dot input:checked+span{background:var(--acc);border-color:var(--acc);color:#fff;transform:scale(1.08)}
.dot input:focus-visible+span{outline:3px solid var(--acc);outline-offset:2px}
.warmnote{margin:10px 0 0;font-size:14px;color:var(--muted)}
/* adjust numbers */
details.adj{margin-top:10px}
details.adj summary{cursor:pointer;color:var(--muted);font-size:14px;font-weight:600;padding:6px 0;list-style:none;display:flex;gap:8px;align-items:center}
details.adj summary::-webkit-details-marker{display:none}
details.adj summary::before{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .15s}
details.adj[open] summary::before{transform:rotate(45deg)}
details.adj summary em{font-style:normal;color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 6px}
.chip{position:relative;display:inline-flex;align-items:center;gap:5px;border:1.5px solid var(--rule);
  border-radius:999px;padding:7px 12px;font-size:13px;color:var(--muted);line-height:1.2;background:var(--bg)}
.chip b{font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
.chip.mod{border-color:var(--acc)}

.chip{cursor:pointer;font:inherit;font-size:13px}
button.chip::after{display:none}
.chip.on{border-color:var(--acc);padding:4px 5px;gap:8px}
.cbtn{width:40px;height:40px;flex:0 0 auto;border-radius:50%;border:1.5px solid var(--acc);color:var(--acc);
  background:none;font-size:19px;line-height:1;display:grid;place-items:center}
.cbtn:disabled{opacity:.3;border-color:var(--rule);color:var(--muted)}
.tot{font-size:13px;color:var(--muted);margin-left:2px}
.muted{color:var(--muted);font-weight:400}
/* phase colours */
:root{--rest:#1E8E5A;--readyc:var(--ink);--wash-work:rgba(184,53,42,.16);--wash-rest:rgba(30,142,90,.16)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--rest:#4CC38A;--readyc:#FFFFFF;--wash-work:rgba(238,114,99,.20);--wash-rest:rgba(76,195,138,.18)}}
:root[data-theme="dark"]{--rest:#4CC38A;--readyc:#FFFFFF;--wash-work:rgba(238,114,99,.20);--wash-rest:rgba(76,195,138,.18)}
#fa{transition:background-color .3s}
#fa.ph-work{background:linear-gradient(to top,var(--wash-work),var(--bg) 75%) var(--bg)}
#fa.ph-rest{background:linear-gradient(to top,var(--wash-rest),var(--bg) 75%) var(--bg)}
#fa.ph-ready .fanum{color:var(--readyc)}
#fa.ph-work .fanum{color:var(--acc)}
#fa.ph-rest .fanum{color:var(--rest)}
#fa.ph-ready .falbl{color:var(--readyc)}
#fa.ph-work .falbl{color:var(--acc)}
#fa.ph-rest .falbl{color:var(--rest)}
/* running view: the number takes over */
#fa.running .fabody .frames,#fa.running .fabody .cue,#fa.running .fabody .sub{display:none}
#fa.running .fabody{flex:0 0 auto}
#fa.running .fatimer{flex:1;display:flex;flex-direction:column;justify-content:center}
#fa.running .fanum{font-size:min(42vw,200px)}
#fa.running .falbl{font-size:20px}
.slotnote{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.slotbox{border:1.5px solid var(--rule);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.slothead{margin:0;font-weight:600;font-size:14px;color:var(--acc)}
.ready-chip b{color:var(--ink)}
.falv{margin:0 0 12px}
/* errors + diagnostics */
#err{position:fixed;left:10px;right:10px;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:50;background:#B8352A;color:#fff;
  padding:12px 14px;border-radius:12px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.3)}
#dbg{position:fixed;left:8px;right:8px;bottom:8px;z-index:41;background:#000;color:#0f0;
  font:11px/1.35 ui-monospace,monospace;white-space:pre-wrap;padding:8px;border-radius:8px;max-height:40vh;overflow:auto;pointer-events:none}
</style>
</head>
<body>
<div class="wrap">
  <svg class="flags" id="flags" viewBox="0 0 400 64" aria-hidden="true"></svg>
  <nav id="progs" aria-label="Programs"></nav>
  <header><h1 id="ptitle"></h1><p class="lede" id="plede"></p></header>
  <main id="main"></main>
  <footer id="foot"></footer>
</div>

<dialog id="dlg"><form method="dialog" id="frm">
  <h2 id="dlgT">Add exercise</h2>
  <label>Name<input name="name" required autocomplete="off"></label>
  <label class="customonly">Type<select name="kind">
    <option value="reps">Sets and reps</option><option value="hold">Timed hold</option>
    <option value="iv">Intervals (work / rest)</option><option value="text">Just a description</option></select></label>
  <label class="chk customonly"><input type="checkbox" name="sides"> Timed holds: do each side</label>
  <label>What to watch for<textarea name="cue" rows="2"></textarea></label>
  <div class="slotbox slotonly"><p class="slothead" id="slotHead">Slot 1</p>
    <label>Slot name<input name="slotname" autocomplete="off"></label>
    <label>Slot note <span class="hint">optional, e.g. which tools or weights</span><input name="slotnote" autocomplete="off"></label>
    <button type="button" class="link" id="slotReset">Reset this slot to default</button></div>
  <label class="customonly newonly">Slot names <span class="hint">optional, easiest first, one per line, up to 5</span><textarea name="levels" rows="4" placeholder="Bodyweight&#10;Hold 5 kg&#10;Hold 10 kg"></textarea></label>
  <label>Group<select name="tier"><option value="e">Essential, do every time</option><option value="x">Extra, when there's time</option></select></label>
  <label class="customonly">Picture<select name="pic"></select></label>
  <p class="hint customonly">Set the numbers afterwards with "Adjust numbers" on the card.</p>
  <div class="dbtns"><button type="button" class="btn danger" id="dlgDel">Delete</button><span></span>
    <button class="btn" value="cancel" formnovalidate>Cancel</button><button class="btn pri" value="save">Save</button></div>
</form></dialog>

<div id="fa" role="dialog" aria-modal="true" aria-label="Follow along">
  <div class="fatop"><span class="fastep" id="faStep"></span><button class="x" id="faX" aria-label="Close">✕</button></div>
  <div class="faprog" id="faProg"></div>
  <div class="fabody" id="faBody"></div>
  <div class="fatimer"><div class="fanum" id="faNum"></div><div class="falbl" id="faLbl"></div>
    <button class="link" id="faSkip" style="display:none">Skip</button></div>
  <div class="fabtns"><button class="btn" id="faPrev">Back</button><button class="btn pri" id="faGo">Start</button><button class="btn" id="faNext">Next</button></div>
</div>
<script>
/* ---------- drawing ---------- */
const L1=28,L2=28,T=38,UA=20,FA=18;
const rad=d=>d*Math.PI/180;
const f1=p=>p.map(v=>v.toFixed(1)).join(',');
function ik(a,b,l1,l2,rule){
  let dx=b[0]-a[0],dy=b[1]-a[1],d=Math.hypot(dx,dy)||0.01;
  const max=l1+l2-0.2;let end=[b[0],b[1]];
  if(d>max){end=[a[0]+dx/d*max,a[1]+dy/d*max];d=max}
  const base=Math.atan2(dy,dx);
  const c=Math.max(-1,Math.min(1,(l1*l1+d*d-l2*l2)/(2*l1*d))),ang=Math.acos(c);
  const k1=[a[0]+l1*Math.cos(base+ang),a[1]+l1*Math.sin(base+ang)];
  const k2=[a[0]+l1*Math.cos(base-ang),a[1]+l1*Math.sin(base-ang)];
  let k;
  if(rule==='fwd')k=k1[0]>=k2[0]?k1:k2;
  else if(rule==='back')k=k1[0]<=k2[0]?k1:k2;
  else if(rule==='down')k=k1[1]>=k2[1]?k1:k2;
  else k=k1[1]<=k2[1]?k1:k2;
  return{k,end};
}
const poly=(pts,cls)=>`<polyline class="${cls}" points="${pts.map(f1).join(' ')}"/>`;
function side(p){
  const t=rad(p.torso||0),hip=p.hip,dir=[Math.sin(t),-Math.cos(t)];
  const sh=[hip[0]+T*dir[0],hip[1]+T*dir[1]];
  const ht=t+rad(p.headAng||0),head=[sh[0]+13*Math.sin(ht),sh[1]-13*Math.cos(ht)];
  const leg=(ank,rule,f)=>{const r=ik(hip,ank,L1,L2,rule||'fwd');const a=rad(f||0);return[hip,r.k,r.end,[r.end[0]+10*Math.cos(a),r.end[1]+10*Math.sin(a)]]};
  const arm=(hand,rule)=>{const r=ik(sh,hand,UA,FA,rule||'back');return[sh,r.k,r.end]};
  const nh=arm(p.hand||[sh[0]+3,sh[1]+36],p.elbow);
  let s='';
  if(p.hand2)s+=poly(arm(p.hand2,p.elbow2),'far');
  s+=poly(leg(p.far,p.farKnee,p.farFoot),'far');
  if(p.pack){const m=[(hip[0]+sh[0])/2,(hip[1]+sh[1])/2],n=[-Math.cos(t),-Math.sin(t)];
    s+=`<rect class="pack" x="-6" y="-14" width="12" height="26" rx="3" transform="translate(${f1([m[0]+n[0]*8,m[1]+n[1]*8-3])}) rotate(${p.torso||0})"/>`}
  if(p.bend){const m=[(hip[0]+sh[0])/2,(hip[1]+sh[1])/2],n=[-Math.cos(t),-Math.sin(t)],c=[m[0]+n[0]*p.bend*2,m[1]+n[1]*p.bend*2];
    s+=`<path class="ink" d="M${f1(hip)} Q${f1(c)} ${f1(sh)}"/>`}
  else s+=poly([hip,sh],'ink');
  s+=poly(leg(p.near,p.nearKnee,p.nearFoot),'ink');
  s+=`<circle class="head" cx="${head[0].toFixed(1)}" cy="${head[1].toFixed(1)}" r="8"/>`;
  s+=poly(nh,'ink');
  if(p.db){const h=nh[2];s+=`<rect class="dbl" x="${h[0]-8}" y="${h[1]-1.5}" width="16" height="3" rx="1.5"/><rect class="dbl" x="${h[0]-10}" y="${h[1]-5}" width="5" height="10" rx="1.5"/><rect class="dbl" x="${h[0]+5}" y="${h[1]-5}" width="5" height="10" rx="1.5"/>`}
  return s;
}
function front(p){
  const hip=p.hip,hl=[hip[0]-7,hip[1]],hr=[hip[0]+7,hip[1]];
  const sc=[hip[0],hip[1]-T],sl=[sc[0]-11,sc[1]],sr=[sc[0]+11,sc[1]],head=[sc[0],sc[1]-13];
  const rl=ik(hl,p.L,L1,L2,'back'),rr=ik(hr,p.R,L1,L2,'fwd');
  const hs=p.hands||[[hip[0]-9,hip[1]-3],[hip[0]+9,hip[1]-3]];
  const al=ik(sl,hs[0],UA,FA,p.hands?'up':'back'),ar=ik(sr,hs[1],UA,FA,p.hands?'up':'fwd');
  let s='';
  s+=poly([hl,rl.k,rl.end,[rl.end[0]-7,rl.end[1]+1]],'ink');
  s+=poly([hr,rr.k,rr.end,[rr.end[0]+7,rr.end[1]+1]],'ink');
  s+=poly([sl,sr],'ink')+poly([sc,hip],'ink')+poly([hl,hr],'ink');
  s+=poly([sl,al.k,al.end],'ink')+poly([sr,ar.k,ar.end],'ink');
  s+=`<circle class="head" cx="${head[0]}" cy="${head[1]}" r="8"/>`;
  if(p.band){const a=[rl.k[0]+1,rl.k[1]+4],b=[rr.k[0]-1,rr.k[1]+4];
    s+=`<line class="band" x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}"/>`}
  if(p.circles){[al.end,ar.end].forEach(h=>{s+=`<circle class="acc" cx="${h[0].toFixed(1)}" cy="${h[1].toFixed(1)}" r="11" stroke-dasharray="52 18"/>`+`<polygon class="accf" points="${f1([h[0]+11,h[1]-9])} ${f1([h[0]+4,h[1]-14])} ${f1([h[0]+13,h[1]-17])}"/>`})}
  return s;
}
const box=(x,top,w)=>`<rect class="prop" x="${x}" y="${top}" width="${w}" height="${145-top}" rx="2"/>`;

function arrow(x1,y1,x2,y2){
  const a=Math.atan2(y2-y1,x2-x1),h=8,bx=x2-5*Math.cos(a),by=y2-5*Math.sin(a);
  const p1=[x2-h*Math.cos(a-.5),y2-h*Math.sin(a-.5)],p2=[x2-h*Math.cos(a+.5),y2-h*Math.sin(a+.5)];
  return `<line class="acc" x1="${x1}" y1="${y1}" x2="${bx.toFixed(1)}" y2="${by.toFixed(1)}"/><polygon class="accf" points="${x2},${y2} ${f1(p1)} ${f1(p2)}"/>`;
}
function frameSVG(fr){
  let s=(fr.nofloor?'':`<line class="floor" x1="0" y1="145.5" x2="160" y2="145.5"/>`)+(fr.props||[]).join('');
  s+=fr.front?front(fr.pose):side(fr.pose);
  (fr.arrows||[]).forEach(a=>s+=arrow(...a));
  return `<svg viewBox="0 0 160 160" role="img" aria-label="${esc(fr.cap)}">${s}</svg>`;
}

function clean(raw){
  const S0=Object.assign(blank(),raw||{});
  ['custom','edits','levels','tune','tiers','slots','settings'].forEach(k=>{if(!S0[k]||typeof S0[k]!=='object'||Array.isArray(S0[k]))S0[k]={}});
  if(!READY_OPTS.includes(S0.settings.ready))S0.settings.ready=10;
  if(!Array.isArray(S0.hidden))S0.hidden=[];
  // built-in edits keep only name and cue; numbers now live in levels and tuning
  Object.keys(S0.edits).forEach(id=>{const e=S0.edits[id]||{};const k={};
    if(e.name)k.name=e.name;if(e.cue)k.cue=e.cue;
    if(Object.keys(k).length)S0.edits[id]=k;else delete S0.edits[id]});
  Object.keys(S0.levels).forEach(id=>{const v=parseInt(S0.levels[id],10);
    if(!(v>=0&&v<=4))delete S0.levels[id];else S0.levels[id]=v});
  // older versions kept per-level tweaks in tune["id@N"]: move them into that slot
  Object.keys(S0.tune).forEach(k=>{const m=k.match(/^([^:@]+)@([0-4])$/);if(!m)return;
    const sl=S0.slots[m[1]]=S0.slots[m[1]]||{};const o=sl[m[2]]=sl[m[2]]||{};
    o.p={...(S0.tune[k]||{}),...(o.p||{})};delete S0.tune[k]});
  Object.keys(S0.slots).forEach(id=>{const sl=S0.slots[id];if(!sl||typeof sl!=='object'){delete S0.slots[id];return}
    Object.keys(sl).forEach(i=>{if(!/^[0-4]$/.test(i)||!sl[i]||typeof sl[i]!=='object')delete sl[i]});
    if(!Object.keys(sl).length)delete S0.slots[id]});
  return S0;
}

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const fmtS=t=>t>=60?(t%60?`${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`:`${t/60} min`):t+' s';

function doseOf(kind,p){
  if(kind==='reps')return `${p.sets>1?p.sets+' × ':''}${p.reps}${p.unit||(p.sets>1?'':(p.reps===1?' rep':' reps'))}`;
  if(kind==='hold')return `${p.sets>1?p.sets+' × ':''}${fmtS(p.time)}${p.sides?' '+(p.sideWord||'per side'):''}`;
  if(kind==='iv')return `${p.sets>1?p.sets+' × ':''}${p.reps} × ${fmtS(p.work)}, ${fmtS(p.rest)} rest`;
  return p.dose||'';
}
function phasesOf(e){
  const p=e.p,ph=[];
  if(e.kind==='iv'){
    for(let st=1;st<=p.sets;st++){
      for(let r=1;r<=p.reps;r++){
        ph.push({t:p.work,l:`Rep ${r} of ${p.reps}${p.sets>1?` · set ${st} of ${p.sets}`:''}`,work:true,kind:'work'});
        if(r<p.reps&&p.rest)ph.push({t:p.rest,l:'Rest',work:false,kind:'rest'});
      }
      if(st<p.sets&&p.setRest)ph.push({t:p.setRest,l:`Rest before set ${st+1}`,work:false,kind:'rest'});
    }
  }else if(e.kind==='hold'){
    for(let st=1;st<=p.sets;st++){
      const lab=p.sets>1?`Set ${st} of ${p.sets}`:'Hold';
      if(p.sides){ph.push({t:p.time,l:lab+' · first side',work:true,kind:'work'});ph.push({t:5,l:'Switch sides',work:false,kind:'ready'});ph.push({t:p.time,l:lab+' · second side',work:true,kind:'work'})}
      else ph.push({t:p.time,l:lab,work:true,kind:'work'});
      if(st<p.sets&&p.rest)ph.push({t:p.rest,l:'Rest',work:false,kind:'rest'});
    }
  }
  return ph.length?ph:null;
}
const totalOf=e=>{const ph=phasesOf(e);return ph?ph.reduce((a,x)=>a+x.t,0):0};

const DEF={reps:{sets:3,reps:10,unit:''},hold:{sets:1,time:30,rest:30,sides:false},iv:{reps:6,work:10,rest:20,sets:1,setRest:120},text:{dose:''}};
function baseOf(id){
  const c=S.custom[id];
  if(c){
    const kind=DEF[c.kind]?c.kind:'reps';
    const P={...DEF[kind],...(c.P||{})};if(kind==='hold')P.sides=!!c.sides;
    const names=(c.levels||[]).slice(0,5);const L=[0,1,2,3,4].map(i=>({v:names[i]||('Slot '+(i+1)),p:{}}));
    return {name:c.name,cue:c.cue||'',frames:c.pic&&EX[c.pic]?EX[c.pic].frames:[],kind,P,L,custom:true};
  }
  const b=EX[id];if(!b)return null;
  const ed=S.edits[id]||{};
  return {...b,name:ed.name||b.name,cue:ed.cue!=null&&ed.cue!==''?ed.cue:b.cue};
}
function resolve(item,pid){
  const it=typeof item==='string'?{id:item}:item;
  const b=baseOf(it.id);if(!b)return null;
  const warm=!!it.warm, L=warm?null:(b.L||null);
  const lvl=L?Math.min(S.levels[it.id]||0,L.length-1):-1;
  const key=warm?`${pid}:${it.id}@w`:(L?`${it.id}@${lvl}`:`${it.id}@x`);
  const preset=warm?{...(b.P||{}),...it.warm}:{...(b.P||{}),...(L?L[lvl].p:{})};
  let p,tuned,slotName='',slotNote='',slotEdited=false;
  if(L){const o=((S.slots[it.id]||{})[lvl])||{};
    p={...preset,...(o.p||{})};tuned=!!(o.p&&Object.keys(o.p).length);
    slotName=o.name||L[lvl].v;slotNote=o.note||'';slotEdited=tuned||!!o.name||!!o.note}
  else{const tune=S.tune[key]||{};p={...preset,...tune};tuned=Object.keys(tune).length>0}
  return {id:it.id,pid,name:b.name,cue:b.cue,frames:b.frames||[],kind:b.kind,P:preset,p,L,lvl,key,warm,
    tuned,slotEdited,note:slotNote,version:slotName,defName:L?L[lvl].v:'',dose:doseOf(b.kind,p),
    timed:b.kind==='hold'||b.kind==='iv',custom:!!b.custom,edited:!!S.edits[it.id]};
}
function sectionItems(p,si){
  const sec=p.sections[si],list=sec.items.slice();
  Object.entries(S.custom).filter(([,c])=>c.prog===p.id&&c.sec===si).sort((a,b)=>a[1].created-b[1].created).forEach(([id])=>list.push(id));
  const extra=sec.extra||[];
  return list.filter(it=>!S.hidden.includes(p.id+':'+(typeof it==='string'?it:it.id)))
    .map(it=>{const e=resolve(it,p.id);if(!e)return null;

   ${chips?`<details class="adj" data-oid="${esc(e.pid+':'+e.id)}"${openAdj.has(e.pid+':'+e.id)?' open':''}><summary>Adjust numbers${e.tuned?' <em>edited</em>':''}</summary>
      <div class="chips">${chipsHTML(e)}${e.timed?`<span class="tot">≈${Math.max(1,Math.round(totalOf(e)/60))} min</span>`:''}</div>
      ${e.tuned?`<button class="link" data-act="untune" data-key="${esc(e.key)}">Reset ${e.L?'slot '+(e.lvl+1):'to the standard'} numbers</button>`:''}</details>`:''}
   <div class="acts">${e.timed?`<button class="go sm" data-act="one">${playIcon}Start</button>`:''}<button class="link" data-act="edit">Edit</button>${e.custom?'':`<button class="link" data-act="hide">Hide</button>`}</div>
  </article>`;
}
function render(){
  const p=prog();
  document.getElementById('ptitle').textContent=p.title;
  document.getElementById('plede').textContent=p.lede;
  document.title=p.title;
  document.getElementById('progs').innerHTML=PROGS.map(x=>`<button data-prog="${x.id}" aria-pressed="${x.id===cur}">${x.chip}</button>`).join('');
  document.getElementById('main').innerHTML=p.sections.map((s,si)=>{
    let items;try{items=sectionItems(p,si)}catch(err){showErr('Could not build '+s.title+': '+err.message);items=[]}
    const ess=items.filter(e=>e.tier==='e'),ext=items.filter(e=>e.tier!=='e');
    const head=p.routine?`<p class="sub">Essentials about ${estimate(ess)} min, full routine about ${estimate(items)} min</p>`:`<h2>${s.title}</h2><p class="sub">${s.sub}</p>`;
    const cards=list=>list.map(e=>{try{return card(e)}catch(err){showErr('Could not draw '+e.id+': '+err.message);return ''}}).join('');
    const grp=(list,name,note)=>list.length?`<div class="grp"><h4>${name}</h4><span>${note}</span></div>${cards(list)}`:'';
    return `<section><div class="sechead"><div>${head}</div>${items.length?`<div class="gos">${ess.length?`<button class="go" data-act="start" data-mode="e" data-sec="${si}">${playIcon}Essentials</button>`:''}<button class="go alt" data-act="start" data-mode="all" data-sec="${si}">${playIcon}Full</button></div>`:''}</div>
      ${grp(ess,'Essential','Do these every time')}${grp(ext,'Extra','When you have time')}
      <button class="add" data-act="add" data-sec="${si}">+ Add exercise${p.routine?'':' to '+s.title.toLowerCase()}</button></section>`;
  }).join('');
  const hid=S.hidden.filter(h=>h.startsWith(p.id+':')).length;
  document.getElementById('foot').innerHTML=(hid?`<button class="link" data-act="unhide">Show ${hid} hidden exercise${hid>1?'s':''}</button><br>`:'')
    +'Your levels and changes are saved on this phone. '
    +'<button class="link" data-act="export">Back up</button> · <button class="link" data-act="import">Restore</button>';
}
function refresh(){try{render()}catch(err){showErr('Page error: '+err.message)}if(fa.classList.contains('open'))reloadFA()}

/* ---------- errors + diagnostics ---------- */
let diag=false;
function showErr(msg){let b=document.getElementById('err');
  if(!b){b=document.createElement('div');b.id='err';b.setAttribute('role','alert');document.body.appendChild(b);
    b.addEventListener('click',()=>b.remove())}
  b.textContent=msg+'  (tap to dismiss)';log('ERROR '+msg)}
function log(msg){if(!diag)return;let p=document.getElementById('dbg');
  if(!p){p=document.createElement('div');p.id='dbg';document.body.appendChild(p)}
  p.textContent=(new Date().toLocaleTimeString()+' '+msg+'\n'+p.textContent).split('\n').slice(0,16).join('\n')}
window.addEventListener('error',ev=>showErr('Script error: '+(ev.message||'unknown')));
window.addEventListener('unhandledrejection',ev=>showErr('Error: '+(ev.reason&&ev.reason.message||ev.reason)));

/* ---------- changes ---------- */
function setLevel(id,v){
  const b=baseOf(id);const n=b&&b.L?b.L.length:0;
  if(!n||!(v>=0&&v<n))return;
  S.levels[id]=v;save();refresh();
}
function slotObj(id,i,create){const sl=S.slots[id]||(create?(S.slots[id]={}):null);if(!sl)return null;
  return sl[i]||(create?(sl[i]={}):null)}
function pruneSlot(id,i){const sl=S.slots[id];if(!sl||!sl[i])return;const o=sl[i];
  if(o.p&&!Object.keys(o.p).length)delete o.p;if(!o.name)delete o.name;if(!o.note)delete o.note;
  if(!Object.keys(o).length)delete sl[i];if(!Object.keys(sl).length)delete S.slots[id]}
function setTune(key,k,v){
  const e=findByKey(key);if(!e)return;
  if(e.L&&!e.warm){const o=slotObj(e.id,e.lvl,true);o.p={...(o.p||{})};
    if(e.P[k]===v)delete o.p[k];else o.p[k]=v;pruneSlot(e.id,e.lvl)}
  else{const t={...(S.tune[key]||{})};
    if(e.P[k]===v)delete t[k];else t[k]=v;
    if(Object.keys(t).length)S.tune[key]=t;else delete S.tune[key]}
  save();refresh();
}
function resetNumbers(key){const e=findByKey(key);if(!e)return;
  if(e.L&&!e.warm){const o=slotObj(e.id,e.lvl,false);if(o){delete o.p;pruneSlot(e.id,e.lvl)}}
  else delete S.tune[key];
  openChip=null;save();refresh()}
function findByKey(key){
  if(F.open&&F.src[F.i]){const e=resolveSrc(F.src[F.i]);if(e&&e.key===key)return e}
  const p=prog();for(let si=0;si<p.sections.length;si++){const e=sectionItems(p,si).find(x=>x.key===key);if(e)return e}
  return null;
}
// Native controls fire 'change' reliably even where tap-to-click is unreliable.
document.addEventListener('change',ev=>{
  const t=ev.target;
  
  try{
    if(t.matches('input[data-lv]')){setLevel(t.dataset.lv,parseInt(t.value,10));return}
  }catch(err){showErr('Change failed: '+err.message)}
});
document.addEventListener('toggle',ev=>{const d=ev.target;if(d.matches&&d.matches('details.adj')){d.open?openAdj.add(d.dataset.oid):openAdj.delete(d.dataset.oid)}},true);

/* ---------- clicks ---------- */
document.getElementById('progs').addEventListener('click',e=>{
  const b=e.target.closest('[data-prog]');if(!b)return;
  cur=b.dataset.prog;try{localStorage.setItem('tpg:prog',cur)}catch(_){}
  history.replaceState(null,'','#'+cur);refresh();window.scrollTo(0,0);
});
document.body.addEventListener('click',e=>{
  const b=e.target.closest('button[data-act]');if(!b||b.closest('#progs'))return;
  try{onAct(b)}catch(err){showErr('Action failed: '+err.message)}
});
function onAct(b){
  const act=b.dataset.act,art=b.closest('.ex'),p=prog();
  log('tap '+act);
  if(act==='start'){const all=sectionItems(p,+b.dataset.sec),q=b.dataset.mode==='e';
    openFA((q?all.filter(e=>e.tier==='e'):all),(p.sections.length>1?p.sections[+b.dataset.sec].title:p.title)+(q?', essentials':''));return}
  if(act==='add'){openDlg(null,+b.dataset.sec);return}
  if(act==='unhide'){S.hidden=S.hidden.filter(h=>!h.startsWith(p.id+':'));save();refresh();return}
  if(act==='export'){exportData();return}
  if(act==='import'){importData();return}
  if(act==='untune'){resetNumbers(b.dataset.key);return}
  if(act==='rstep'){const i=READY_OPTS.indexOf(S.settings.ready);const ni=Math.max(0,Math.min(READY_OPTS.length-1,i+(+b.dataset.d)));
    S.settings.ready=READY_OPTS[ni];save();F.shown='';if(F.open&&!F.run&&!started())setEx(true);else drawFA();return}
  if(act==='tsel'){openChip=openChip===b.dataset.chip?null:b.dataset.chip;F.shown='';refresh();return}
  if(act==='tstep'){const e=findByKey(b.dataset.key);if(!e)return;const k=b.dataset.k;
    const nv=stepOf(k,e.p[k],+b.dataset.d);if(nv!==e.p[k])setTune(b.dataset.key,k,nv);return}
  if(!art)return;
  const id=art.dataset.id,sec=+art.dataset.sec;
  if(act==='one'){const e=sectionItems(p,sec).find(x=>x.id===id);if(e)openFA([e],e.name);return}
  if(act==='hide'){S.hidden.push(p.id+':'+id);save();refresh();return}
  if(act==='edit'){openDlg(id,sec);return}
}

/* ---------- dialog ---------- */
const dlg=document.getElementById('dlg'),frm=document.getElementById('frm');
let editing=null;
function openDlg(id,sec){
  const p=prog();editing={id,sec};
  const e=id?sectionItems(p,sec).find(x=>x.id===id):null;
  const isCustom=!id||!!S.custom[id];
  document.getElementById('dlgT').textContent=id?'Edit exercise':'Add exercise';
  frm.name.value=e?e.name:'';frm.cue.value=e?e.cue:'';
  frm.tier.value=e?e.tier:'e';
  const c=id?S.custom[id]:null;
  frm.kind.value=c?c.kind||'reps':'reps';frm.sides.checked=!!(c&&c.sides);
  frm.levels.value=c?(c.levels||[]).join('\n'):'';
  frm.pic.innerHTML='<option value="">No picture</option>'+Object.entries(EX).filter(([,x])=>x.frames.length).map(([k,x])=>`<option value="${k}">${esc(x.name)}</option>`).join('');
  frm.pic.value=c?c.pic||'':'';
  document.querySelectorAll('.customonly').forEach(n=>n.style.display=isCustom?'':'none');
  document.querySelectorAll('.newonly').forEach(n=>n.style.display=id?'none':'');
  const hasSlot=!!(e&&e.L&&!e.warm);
  document.querySelectorAll('.slotonly').forEach(n=>n.style.display=hasSlot?'':'none');
  if(hasSlot){document.getElementById('slotHead').textContent='Slot '+(e.lvl+1)+' (the one selected on the card)';
    frm.slotname.value=e.version;frm.slotname.placeholder=e.defName;frm.slotnote.value=e.note||'';
    document.getElementById('slotReset').style.display=e.slotEdited?'':'none'}
  editing.slot=hasSlot?e.lvl:null;editing.defName=hasSlot?e.defName:'';
  const del=document.getElementById('dlgDel');
  if(!id)del.style.display='none';
  else if(isCustom){del.style.display='';del.textContent='Delete'}
  else{const k=p.id+':'+id;del.style.display=(S.edits[id]||S.tiers[k])?'':'none';del.textContent='Reset to original'}
  dlg.returnValue='';dlg.showModal();
}
document.getElementById('slotReset').addEventListener('click',()=>{
  const {id,slot}=editing;if(slot==null)return;
  if(!confirm('Reset slot '+(slot+1)+' name, note and numbers to the default?'))return;
  const sl=S.slots[id];if(sl){delete sl[slot];if(!Object.keys(sl).length)delete S.slots[id]}
  save();dlg.close('done');refresh();
});
document.getElementById('dlgDel').addEventListener('click',()=>{
  const {id}=editing,p=prog();
  if(S.custom[id]){if(!confirm('Delete this exercise?'))return;
    delete S.custom[id];delete S.levels[id];delete S.slots[id];Object.keys(S.tune).forEach(k=>{if(k.startsWith(id+'@'))delete S.tune[k]})}
  else{delete S.edits[id];delete S.tiers[p.id+':'+id]}
  save();dlg.close('done');refresh();
});
frm.addEventListener('submit',ev=>{
  if(!ev.submitter||ev.submitter.value!=='save')return;
  const name=frm.name.value.trim();if(!name)return;
  const {id,sec}=editing,p=prog(),tier=frm.tier.value,cue=frm.cue.value.trim();
  if(editing.slot!=null){const o=slotObj(id,editing.slot,true);
    const sn=frm.slotname.value.trim(),nt=frm.slotnote.value.trim();
    o.name=sn&&sn!==editing.defName?sn:'';o.note=nt;pruneSlot(id,editing.slot)}
  if(!id||S.custom[id]){
    const v={name,cue,tier,kind:frm.kind.value,sides:frm.sides.checked,pic:frm.pic.value};
    if(!id){v.levels=frm.levels.value.split('\n').map(x=>x.trim()).filter(Boolean).slice(0,5);
      const nid='c'+Date.now().toString(36);S.custom[nid]={...v,prog:p.id,sec,created:Date.now()}}
    else{const old=S.custom[id];if(old.kind!==v.kind){delete S.slots[id];Object.keys(S.tune).forEach(k=>{if(k.startsWith(id+'@'))delete S.tune[k]})}
      Object.assign(old,v)}
  }else{
    const b=EX[id],ed={};
    if(name!==b.name)ed.name=name;if(cue!==b.cue)ed.cue=cue;
    if(Object.keys(ed).length)S.edits[id]=ed;else delete S.edits[id];
    const def=(p.sections[sec].extra||[]).includes(id)?'x':'e',k=p.id+':'+id;
    if(tier!==def)S.tiers[k]=tier;else delete S.tiers[k];
  }
  save();refresh();
});

/* ---------- backup ---------- */
function exportData(){
  const blob=new Blob([JSON.stringify({app:'training-guide',v:3,saved:new Date().toISOString(),data:S},null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='training-guide-backup-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}
function importData(){
  const inp=document.createElement('input');inp.type='file';inp.accept='application/json,.json';
  inp.onchange=()=>{const file=inp.files[0];if(!file)return;const r=new FileReader();
    r.onload=()=>{try{const j=JSON.parse(r.result);const d=j&&j.data?j.data:j;
      if(!d||typeof d!=='object'||!('levels' in d))throw new Error('this is not a training-guide backup');
      if(!confirm('Replace everything on this phone with the backup?'))return;
      S=clean(d);save();refresh()}catch(e){showErr('Restore failed: '+e.message)}};
    r.readAsText(file)};
  inp.click();
}

/* ---------- follow along ---------- */
const fa=document.getElementById('fa');
const F={open:false,src:[],i:0,title:'',ph:null,p:0,left:0,run:false,done:false,timer:null,last:0,lock:null,shown:''};
let actx=null;
function tone(freq,dur,delay=0,vol=.22){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
  const t0=actx.currentTime+delay,o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=freq;
  g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+.015);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g).connect(actx.destination);o.start(t0);o.stop(t0+dur+.02)}catch(e){}}
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
const SOUND={
  tick:()=>{tone(660,.12);buzz(40)},
  work:()=>{tone(1046,.5,0,.3);buzz(350)},
  rest:()=>{tone(523,.22);tone(392,.4,.2);buzz([120,80,120])},
  ready:()=>{tone(784,.3);buzz(150)},
  done:()=>{tone(784,.18);tone(988,.18,.18);tone(1318,.5,.36,.3);buzz([200,100,200,100,400])}};
function beep(){SOUND.work()}
const srcOf=e=>({it:e.warm?{id:e.id,warm:PROGS.find(x=>x.id===e.pid).sections[e.sec].items.find(x=>typeof x!=='string'&&x.id===e.id).warm}:e.id,pid:e.pid,sec:e.sec,tier:e.tier});
function resolveSrc(s){const e=resolve(s.it,s.pid);if(e){e.sec=s.sec;e.tier=s.tier}return e}
const curEx=()=>resolveSrc(F.src[F.i]);
async function openFA(list,title){
  if(!list.length)return;
  F.src=list.map(srcOf);F.i=0;F.title=title;F.open=true;setEx();
  fa.classList.add('open');document.body.style.overflow='hidden';
  try{F.lock=await navigator.wakeLock?.request('screen')}catch(e){}
}
function closeFA(){stop();F.open=false;fa.classList.remove('open','running','ph-ready','ph-work','ph-rest','ph-done');document.body.style.overflow='';try{F.lock&&F.lock.release()}catch(e){}F.lock=null}
function stop(){F.run=false;clearInterval(F.timer);F.timer=null}
function setEx(keepChip){stop();if(!keepChip)openChip=null;const e=curEx();F.ph=e?phasesOf(e):null;
  if(F.ph&&S.settings.ready>0){const first=F.ph[0].l;F.ph.unshift({t:S.settings.ready,l:'Get ready · '+first,work:false,kind:'ready'})}
  F.p=0;F.left=F.ph?F.ph[0].t:0;F.done=false;F.shown='';drawFA()}
function reloadFA(){if(!F.run&&!started())setEx(true);else drawFA()}
const started=()=>F.ph&&(F.p>0||F.left<F.ph[0].t);
function drawFA(){
  const e=curEx();if(!e)return;const n=F.src.length;
  document.getElementById('faStep').textContent=`${F.title}: ${F.i+1} of ${n}`;
  document.getElementById('faProg').innerHTML=F.src.map((_,i)=>`<i class="${i<=F.i?'on':''}"></i>`).join('');
  const ready=!F.run&&!F.done&&!started();
  const sig=[F.i,ready,e.key,e.dose,e.lvl,e.tuned,e.version,e.note,openChip,S.settings.ready].join('|');
  if(sig!==F.shown){F.shown=sig;
    const total=e.timed?totalOf(e):0;
    document.getElementById('faBody').innerHTML=`<h3 class="faname">${esc(e.name)}</h3>
      <p class="dose fadose">${esc(e.dose)}${total?` <span class="muted">· ≈${Math.max(1,Math.round(total/60))} min</span>`:''}</p>
      ${ready&&e.L?`<div class="lv falv"><div class="lvtxt"><span class="lvn">Slot ${e.lvl+1}</span>${esc(e.version)}${e.note?`<span class="slotnote">${esc(e.note)}</span>`:''}</div>${dotsHTML(e,'f')}</div>`:(e.L?`<p class="sub">Slot ${e.lvl+1} · ${esc(e.version)}${e.note?' · '+esc(e.note):''}</p>`:'')}
      ${ready&&(paramsFor(e).length||e.timed)?`<div class="chips">${e.timed?readyChip():''}${chipsHTML(e)}</div>`:''}
      ${framesHTML(e.frames)}
      ${e.cue?`<p class="cue">${esc(e.cue)}</p>`:''}`;
  }
  const num=document.getElementById('faNum'),lbl=document.getElementById('faLbl'),go=document.getElementById('faGo'),skip=document.getElementById('faSkip');
  if(F.ph){
    num.textContent=fmtClock(F.left);
    const kind=F.done?'done':F.ph[F.p].kind||'work',live=F.run||started();
    ['ready','work','rest','done'].forEach(k=>fa.classList.toggle('ph-'+k,live&&k===kind||F.done&&k==='done'));
    fa.classList.toggle('running',F.run);
    lbl.textContent=F.done?'Done':F.ph[F.p].l;
    go.textContent=F.done?'Again':F.run?'Pause':(started()?'Resume':'Start');
    go.style.display='';
    skip.style.display=!F.done&&(F.run||started())?'':'none';
    skip.textContent=F.done?'':F.ph[F.p].kind==='ready'?'Skip countdown':F.ph[F.p].kind==='rest'?'Skip rest':'Skip';
  }else{num.textContent='';['ready','work','rest','done','running'].forEach(k=>fa.classList.remove(k==='running'?k:'ph-'+k));lbl.textContent='Tap Next when you\u2019re done';go.style.display='none';skip.style.display='none'}
  document.getElementById('faPrev').disabled=F.i===0;
  document.getElementById('faNext').textContent=F.i===n-1?'Finish':'Next';
}
function tick(){const k=Math.max(1,Math.round((Date.now()-F.last)/1000));F.last+=k*1000;for(let j=0;j<k&&F.run;j++)step();drawFA()}
function step(){
  F.left--;
  if(F.left>0&&F.left<=3){SOUND.tick();return}
  if(F.left<=0){
    if(F.p<F.ph.length-1){F.p++;F.left=F.ph[F.p].t;(SOUND[F.ph[F.p].kind]||SOUND.work)()}
    else{stop();F.done=true;F.left=0;SOUND.done()}}
}
document.getElementById('faGo').addEventListener('click',()=>{
  if(!F.ph)return;
  if(F.done){setEx()}
  if(F.run){stop();drawFA();return}
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(_){}
  F.run=true;F.last=Date.now();F.timer=setInterval(tick,1000);drawFA();
});
document.getElementById('faSkip').addEventListener('click',()=>{
  if(!F.ph||F.done)return;
  if(F.p<F.ph.length-1){F.p++;F.left=F.ph[F.p].t;F.last=Date.now();if(F.run)(SOUND[F.ph[F.p].kind]||SOUND.work)()}else{stop();F.done=true;F.left=0}
  drawFA();
});
document.getElementById('faNext').addEventListener('click',()=>{if(F.i<F.src.length-1){F.i++;setEx();document.getElementById('faBody').scrollTop=0}else closeFA()});
document.getElementById('faPrev').addEventListener('click',()=>{if(F.i>0){F.i--;setEx()}});
document.getElementById('faX').addEventListener('click',closeFA);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&F.open)closeFA()});
document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&F.open&&!F.lock){try{F.lock=await navigator.wakeLock?.request('screen')}catch(e){}}});
/* ---------- flags ---------- */
(function flags(){
  const cols=['#2F5DA8','#F4F3EE','#B8352A','#2E7D4F','#E1B12C'];
  const P0=[-4,6],P1=[200,46],P2=[404,6];let s=`<path d="M${P0} Q${P1} ${P2}" fill="none" stroke="var(--muted)" stroke-width="1.2"/>`;
  const n=16;
  for(let i=0;i<n;i++){const t=(i+.5)/n,u=1-t;
    const x=u*u*P0[0]+2*u*t*P1[0]+t*t*P2[0],y=u*u*P0[1]+2*u*t*P1[1]+t*t*P2[1];
    const slope=Math.atan2(2*u*(P1[1]-P0[1])+2*t*(P2[1]-P1[1]),2*u*(P1[0]-P0[0])+2*t*(P2[0]-P1[0]))*180/Math.PI;
    s+=`<rect x="${(x-9).toFixed(1)}" y="${y.toFixed(1)}" width="18" height="17" fill="${cols[i%5]}" stroke="rgba(0,0,0,.12)" stroke-width=".6" transform="rotate(${slope.toFixed(1)} ${x.toFixed(1)} ${y.toFixed(1)})"/>`}
  document.getElementById('flags').innerHTML=s;
})();

refresh();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
